<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>投入口</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f0ea;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app {
      min-height: 100dvh;
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        max(18px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .meta {
      margin-top: 4px;
      font-size: 13px;
      color: #777;
    }

    #saveStatus {
      margin-top: 5px;
      font-size: 12px;
      color: #777;
    }

    button {
      border: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #backup {
      background: white;
      color: #555;
      padding: 10px 13px;
      border-radius: 999px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
      white-space: nowrap;
    }

    .storage {
      background: #e7e2d9;
      border-radius: 18px;
      padding: 11px 14px 8px;
      margin-bottom: 14px;
    }

    .storage-label {
      font-size: 12px;
      font-weight: 800;
      color: #777;
      margin-bottom: 6px;
    }

    /* 本文を覗くスクロール窓 */
    #preview {
      height: 82px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;

      background: rgba(255,255,255,.38);
      border-radius: 10px;
      padding: 7px 9px;

      font-size: 13px;
      line-height: 1.45;
      color: #555;
      white-space: pre-wrap;

      scrollbar-width: none;
    }

    #preview::-webkit-scrollbar {
      display: none;
    }

    #previewText {
      white-space: pre-wrap;
      min-height: 100%;
    }

    #fullButton {
      display: block;
      margin: 5px 0 0 auto;
      background: transparent;
      color: #666;
      font-size: 12px;
      padding: 3px;
    }

    .bubble {
      position: relative;
      background: white;
      border: 2px solid #5d91e8;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,.05);
    }

    .bubble::before {
      content: "";
      position: absolute;
      top: -11px;
      left: 28px;
      width: 18px;
      height: 18px;
      background: white;
      border-left: 2px solid #5d91e8;
      border-top: 2px solid #5d91e8;
      transform: rotate(45deg);
    }

    .bubble-title {
      position: relative;
      z-index: 1;
      font-size: 14px;
      font-weight: 800;
      color: #507fc9;
      margin-bottom: 8px;
    }

    #draft {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      min-height: 290px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: #222;
      font: inherit;
      font-size: 18px;
      line-height: 1.55;
    }

    #draft::placeholder { color: #aaa; }

    .send-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    #draftCount {
      color: #888;
      font-size: 13px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #undo {
      display: none;
      background: transparent;
      color: #e5484d;
      padding: 10px;
    }

    #send {
      background: #2563eb;
      color: white;
      padding: 13px 21px;
      border-radius: 999px;
      font-size: 16px;
    }

    #send:disabled { opacity: .3; }

    #toast {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.82);
      color: white;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 800;
      display: none;
      z-index: 30;
      white-space: nowrap;
    }

    #modal {
      position: fixed;
      inset: 0;
      background: #f3f0ea;
      z-index: 20;
      display: none;
      overflow: hidden;
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        max(16px, env(safe-area-inset-bottom));
    }

    .modal-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
    }

    #fullCount {
      font-size: 12px;
      color: #777;
      font-weight: 400;
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .switcher {
      display: flex;
      background: #ddd8cf;
      border-radius: 999px;
      padding: 3px;
    }

    .switcher button {
      background: transparent;
      color: #666;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .switcher button.active {
      background: white;
      color: #2563eb;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    #closeModal {
      background: white;
      border-radius: 999px;
      padding: 9px 12px;
      color: #444;
    }

    .font-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
    }

    .font-label {
      font-size: 11px;
      color: #888;
    }

    #fullSaveStatus {
      font-size: 12px;
      color: #777;
      margin-bottom: 7px;
    }

    .editor-wrap {
      flex: 1;
      min-height: 0;
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    #fullText {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: white;
      color: #222;
      padding: 14px;
      font-size: 16px;
      line-height: 1.4;
      -webkit-overflow-scrolling: touch;
    }

    #fullText.round {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    }

    #fullText.literary {
      font-family:
        "Hiragino Mincho ProN",
        "YuMincho",
        "Yu Mincho",
        serif;
    }

    #fullText.horizontal {
      writing-mode: horizontal-tb;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #fullText.vertical {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: pre-wrap;
      padding: 18px 20px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>投入口</h1>

        <div class="meta">
          📄 本文 <span id="totalCount">0</span>字
          ・ 今回 +<span id="sessionCount">0</span>字
        </div>

        <div id="saveStatus">保存準備中…</div>
      </div>

      <button id="backup">TXTバックアップ</button>
    </header>

    <section class="storage">
      <div class="storage-label">📖 直前　☝️スクロールできます</div>

      <div id="preview">
        <div id="previewText">まだ本文はありません。</div>
      </div>

      <button id="fullButton">本文を編集 ›</button>
    </section>

    <section class="bubble">
      <div class="bubble-title">💬 次を書く。</div>

      <textarea
        id="draft"
        placeholder="ここに続きを投げ込む。"
      ></textarea>

      <div class="send-row">
        <span><span id="draftCount">0</span>字</span>

        <div class="actions">
          <button id="undo">↩︎ Undo</button>
          <button id="send" disabled>送信 ➤</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <section id="modal">
    <div class="modal-inner">

      <div class="modal-head">
        <div class="modal-title">
          📄 本文
          <span id="fullCount">0字</span>
        </div>

        <div class="modal-controls">
          <div class="switcher">
            <button id="horizontalButton">横</button>
            <button id="verticalButton">縦</button>
          </div>

          <button id="closeModal">閉じる</button>
        </div>
      </div>

      <div class="font-row">
        <span class="font-label">文字</span>

        <div class="switcher">
          <button id="roundButton">丸文字</button>
          <button id="literaryButton">文芸</button>
        </div>
      </div>

      <div id="fullSaveStatus">
        編集すると自動保存されます
      </div>

      <div class="editor-wrap">
        <textarea id="fullText"></textarea>
      </div>

    </div>
  </section>

  <script>
    const draft = document.getElementById("draft");
    const send = document.getElementById("send");
    const undo = document.getElementById("undo");
    const backup = document.getElementById("backup");

    const preview = document.getElementById("preview");
    const previewText = document.getElementById("previewText");
    const totalCount = document.getElementById("totalCount");
    const sessionCount = document.getElementById("sessionCount");
    const draftCount = document.getElementById("draftCount");
    const saveStatus = document.getElementById("saveStatus");
    const toast = document.getElementById("toast");

    const fullButton = document.getElementById("fullButton");
    const modal = document.getElementById("modal");
    const fullText = document.getElementById("fullText");
    const fullCount = document.getElementById("fullCount");
    const fullSaveStatus = document.getElementById("fullSaveStatus");
    const closeModal = document.getElementById("closeModal");

    const horizontalButton =
      document.getElementById("horizontalButton");

    const verticalButton =
      document.getElementById("verticalButton");

    const roundButton =
      document.getElementById("roundButton");

    const literaryButton =
      document.getElementById("literaryButton");

    let body = "";
    let sessionAdded = 0;
    let lastSend = null;
    let db = null;
    let draftSaveTimer = null;
    let bodySaveTimer = null;

    let writingDirection = "horizontal";
    let fontMode = "round";

    function countChars(text) {
      return [...text.replace(/\r?\n/g, "")].length;
    }

    function scrollPreviewToEnd() {
      requestAnimationFrame(() => {
        preview.scrollTop = preview.scrollHeight;
      });
    }

    function applyDirection() {
      const vertical = writingDirection === "vertical";

      fullText.classList.toggle("vertical", vertical);
      fullText.classList.toggle("horizontal", !vertical);

      verticalButton.classList.toggle("active", vertical);
      horizontalButton.classList.toggle("active", !vertical);
    }

    function applyFont() {
      const literary = fontMode === "literary";

      fullText.classList.toggle("literary", literary);
      fullText.classList.toggle("round", !literary);

      literaryButton.classList.toggle("active", literary);
      roundButton.classList.toggle("active", !literary);
    }

    function update(keepPreviewPosition = false) {
      totalCount.textContent = countChars(body);
      sessionCount.textContent = sessionAdded;
      draftCount.textContent = countChars(draft.value);
      fullCount.textContent = countChars(body) + "字";

      previewText.textContent =
        body || "まだ本文はありません。";

      send.disabled = !draft.value.trim();
      undo.style.display = lastSend ? "block" : "none";

      if (!keepPreviewPosition) {
        scrollPreviewToEnd();
      }
    }

    function flash(message) {
      toast.textContent = message;
      toast.style.display = "block";

      setTimeout(() => {
        toast.style.display = "none";
      }, 1200);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("tounyuguchiDB", 1);

        request.onupgradeneeded = () => {
          const database = request.result;

          if (!database.objectStoreNames.contains("data")) {
            database.createObjectStore("data");
          }
        };

        request.onsuccess = () => {
          db = request.result;
          resolve();
        };

        request.onerror = () => reject(request.error);
      });
    }

    function getData(key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("data", "readonly");
        const store = tx.objectStore("data");
        const request = store.get(key);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function setData(key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("data", "readwrite");
        const store = tx.objectStore("data");

        store.put(value, key);

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveDraft() {
      await setData("draft", draft.value);
      saveStatus.textContent = "下書き 保存済み";
    }

    draft.addEventListener("input", () => {
      /* 入力中に覗き窓を文末へ勝手に戻さない */
      update(true);

      saveStatus.textContent = "保存中…";
      clearTimeout(draftSaveTimer);

      draftSaveTimer = setTimeout(() => {
        saveDraft().catch(() => {
          saveStatus.textContent = "保存エラー";
        });
      }, 300);
    });

    send.addEventListener("click", async () => {
      if (!draft.value.trim()) return;

      const text = draft.value;
      const previousBody = body;
      const separator = body ? "\n\n" : "";
      const added = countChars(text);

      body += separator + text;

      lastSend = {
        previousBody,
        text
      };

      sessionAdded += added;
      draft.value = "";

      /* 送信したら新しい文末へ */
      update();

      try {
        await setData("body", body);
        await setData("draft", "");

        saveStatus.textContent = "保存済み";
        flash(`パチッ +${added}字`);
      } catch {
        saveStatus.textContent = "保存エラー";
        flash("保存に失敗しました");
      }

      draft.focus();
    });

    undo.addEventListener("click", async () => {
      if (!lastSend) return;

      body = lastSend.previousBody;
      draft.value = lastSend.text;

      sessionAdded = Math.max(
        0,
        sessionAdded - countChars(lastSend.text)
      );

      lastSend = null;
      update();

      try {
        await setData("body", body);
        await setData("draft", draft.value);

        saveStatus.textContent = "Undo 保存済み";
        flash("送信を取り消しました");
      } catch {
        saveStatus.textContent = "保存エラー";
      }

      draft.focus();
    });

    fullButton.addEventListener("click", () => {
      fullText.value = body;
      fullCount.textContent = countChars(body) + "字";

      fullSaveStatus.textContent =
        "編集すると自動保存されます";

      applyDirection();
      applyFont();

      modal.style.display = "block";
    });

    horizontalButton.addEventListener("click", async () => {
      writingDirection = "horizontal";
      applyDirection();

      try {
        await setData("writingDirection", writingDirection);
      } catch {}
    });

    verticalButton.addEventListener("click", async () => {
      writingDirection = "vertical";
      applyDirection();

      try {
        await setData("writingDirection", writingDirection);
      } catch {}
    });

    roundButton.addEventListener("click", async () => {
      fontMode = "round";
      applyFont();

      try {
        await setData("fontMode", fontMode);
      } catch {}
    });

    literaryButton.addEventListener("click", async () => {
      fontMode = "literary";
      applyFont();

      try {
        await setData("fontMode", fontMode);
      } catch {}
    });

    fullText.addEventListener("input", () => {
      body = fullText.value;
      lastSend = null;

      /* 本文編集時は覗き窓も更新 */
      update();

      fullSaveStatus.textContent = "保存中…";
      saveStatus.textContent = "保存中…";

      clearTimeout(bodySaveTimer);

      bodySaveTimer = setTimeout(async () => {
        try {
          await setData("body", body);

          fullSaveStatus.textContent = "保存済み";
          saveStatus.textContent = "保存済み";
        } catch {
          fullSaveStatus.textContent = "保存エラー";
          saveStatus.textContent = "保存エラー";
        }
      }, 300);
    });

    closeModal.addEventListener("click", async () => {
      clearTimeout(bodySaveTimer);

      try {
        body = fullText.value;
        await setData("body", body);

        fullSaveStatus.textContent = "保存済み";
        saveStatus.textContent = "保存済み";
      } catch {
        saveStatus.textContent = "保存エラー";
      }

      update();
      modal.style.display = "none";
    });

    backup.addEventListener("click", async () => {
      const now = new Date();

      const stamp =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0") +
        "_" +
        String(now.getHours()).padStart(2, "0") +
        "-" +
        String(now.getMinutes()).padStart(2, "0");

      const filename = `投入口_${stamp}.txt`;

      const text =
        body +
        (
          draft.value
            ? `\n\n--- 未送信の下書き ---\n\n${draft.value}`
            : ""
        );

      const file = new File(
        [text],
        filename,
        { type: "text/plain;charset=utf-8" }
      );

      try {
        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          await navigator.share({
            files: [file],
            title: "投入口バックアップ"
          });

          flash("バックアップを共有しました");
        } else {
          const url = URL.createObjectURL(file);
          const a = document.createElement("a");

          a.href = url;
          a.download = filename;
          a.click();

          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 1000);

          flash("TXTを作成しました");
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          flash("バックアップに失敗しました");
        }
      }
    });

    async function start() {
      try {
        await openDatabase();

        const savedBody = await getData("body");
        const savedDraft = await getData("draft");
        const savedDirection =
          await getData("writingDirection");
        const savedFont =
          await getData("fontMode");

        if (typeof savedBody === "string") {
          body = savedBody;
        }

        if (typeof savedDraft === "string") {
          draft.value = savedDraft;
        }

        if (
          savedDirection === "vertical" ||
          savedDirection === "horizontal"
        ) {
          writingDirection = savedDirection;
        }

        if (
          savedFont === "round" ||
          savedFont === "literary"
        ) {
          fontMode = savedFont;
        }

        if (navigator.storage?.persist) {
          try {
            await navigator.storage.persist();
          } catch {}
        }

        applyDirection();
        applyFont();

        saveStatus.textContent = "保存機能 ON";

        /* 起動時は必ず本文末尾 */
        update();
      } catch {
        saveStatus.textContent =
          "保存機能を開始できませんでした";

        update();
      }
    }

    start();
  </script>
</body>
</html>
