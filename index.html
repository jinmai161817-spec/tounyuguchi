<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>投入口</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f0ea;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app {
      min-height: 100dvh;
      padding:
        max(16px, env(safe-area-inset-top))
        14px
        max(16px, env(safe-area-inset-bottom));
    }

    header { margin-bottom: 12px; }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .meta {
      margin-top: 4px;
      font-size: 13px;
      color: #777;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .backup-button {
      background: white;
      color: #444;
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
      white-space: nowrap;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-weight: 700;
      margin-bottom: 12px;
    }

    #preview {
      white-space: pre-wrap;
      line-height: 1.7;
      color: #444;
      max-height: 220px;
      overflow-y: auto;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: none;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 18px;
      line-height: 1.6;
      background: transparent;
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      border: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #undo {
      background: transparent;
      color: #e5484d;
      padding: 12px;
      display: none;
    }

    #send {
      background: #2563eb;
      color: white;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 16px;
    }

    #send:disabled { opacity: .35; }

    #saveStatus {
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }

    #toast {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.8);
      color: white;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 800;
      display: none;
      z-index: 10;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="header-row">
        <div>
          <h1>投入口</h1>
          <div class="meta">
            <span id="totalCount">0</span>字
            ・ 今回 +<span id="sessionCount">0</span>字
          </div>
          <div id="saveStatus">保存準備中…</div>
        </div>

        <button id="backup" class="backup-button">
          TXTバックアップ
        </button>
      </div>
    </header>

    <section class="card">
      <div class="card-title">📖 直前の本文</div>
      <div id="preview">まだ本文はありません。</div>
    </section>

    <section class="card">
      <textarea
        id="draft"
        placeholder="💬 次を書く。"
      ></textarea>

      <div class="bottom">
        <span class="meta">
          <span id="draftCount">0</span>字
        </span>

        <div class="buttons">
          <button id="undo">↩︎ Undo</button>
          <button id="send" disabled>送信 ➤</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const draft = document.getElementById("draft");
    const send = document.getElementById("send");
    const undo = document.getElementById("undo");
    const backup = document.getElementById("backup");

    const preview = document.getElementById("preview");
    const totalCount = document.getElementById("totalCount");
    const sessionCount = document.getElementById("sessionCount");
    const draftCount = document.getElementById("draftCount");
    const saveStatus = document.getElementById("saveStatus");
    const toast = document.getElementById("toast");

    let body = "";
    let sessionAdded = 0;
    let lastSend = null;
    let db = null;
    let draftSaveTimer = null;

    function countChars(text) {
      return [...text.replace(/\r?\n/g, "")].length;
    }

    function update() {
      totalCount.textContent = countChars(body);
      sessionCount.textContent = sessionAdded;
      draftCount.textContent = countChars(draft.value);

      preview.textContent =
        body || "まだ本文はありません。";

      send.disabled = !draft.value.trim();
      undo.style.display = lastSend ? "block" : "none";
    }

    function flash(message) {
      toast.textContent = message;
      toast.style.display = "block";

      setTimeout(() => {
        toast.style.display = "none";
      }, 1200);
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("tounyuguchiDB", 1);

        request.onupgradeneeded = () => {
          const database = request.result;

          if (!database.objectStoreNames.contains("data")) {
            database.createObjectStore("data");
          }
        };

        request.onsuccess = () => {
          db = request.result;
          resolve();
        };

        request.onerror = () => reject(request.error);
      });
    }

    function getData(key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("data", "readonly");
        const store = tx.objectStore("data");
        const request = store.get(key);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function setData(key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("data", "readwrite");
        const store = tx.objectStore("data");

        store.put(value, key);

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveBody() {
      await setData("body", body);
      saveStatus.textContent = "本文 保存済み";
    }

    async function saveDraft() {
      await setData("draft", draft.value);
      saveStatus.textContent = "下書き 保存済み";
    }

    draft.addEventListener("input", () => {
      update();

      saveStatus.textContent = "下書き 保存中…";
      clearTimeout(draftSaveTimer);

      draftSaveTimer = setTimeout(() => {
        saveDraft().catch(() => {
          saveStatus.textContent = "保存エラー";
        });
      }, 300);
    });

    send.addEventListener("click", async () => {
      if (!draft.value.trim()) return;

      const text = draft.value;
      const previousBody = body;
      const separator = body ? "\n\n" : "";
      const added = countChars(text);

      body += separator + text;

      lastSend = {
        previousBody,
        text
      };

      sessionAdded += added;
      draft.value = "";

      update();

      try {
        await saveBody();
        await setData("draft", "");
        flash(`パチッ +${added}字`);
      } catch {
        saveStatus.textContent = "保存エラー";
        flash("保存に失敗しました");
      }

      draft.focus();
    });

    undo.addEventListener("click", async () => {
      if (!lastSend) return;

      body = lastSend.previousBody;
      draft.value = lastSend.text;

      sessionAdded = Math.max(
        0,
        sessionAdded - countChars(lastSend.text)
      );

      lastSend = null;
      update();

      try {
        await setData("body", body);
        await setData("draft", draft.value);
        saveStatus.textContent = "Undo 保存済み";
        flash("送信を取り消しました");
      } catch {
        saveStatus.textContent = "保存エラー";
      }

      draft.focus();
    });

    backup.addEventListener("click", async () => {
      const now = new Date();

      const stamp =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0") +
        "_" +
        String(now.getHours()).padStart(2, "0") +
        "-" +
        String(now.getMinutes()).padStart(2, "0");

      const filename = `投入口_${stamp}.txt`;

      const text =
        body +
        (draft.value
          ? `\n\n--- 未送信の下書き ---\n\n${draft.value}`
          : "");

      const file = new File(
        [text],
        filename,
        { type: "text/plain;charset=utf-8" }
      );

      try {
        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          await navigator.share({
            files: [file],
            title: "投入口バックアップ"
          });

          flash("バックアップを共有しました");
        } else {
          const url = URL.createObjectURL(file);
          const a = document.createElement("a");

          a.href = url;
          a.download = filename;
          a.click();

          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 1000);

          flash("TXTを作成しました");
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          flash("バックアップに失敗しました");
        }
      }
    });

    async function start() {
      try {
        await openDatabase();

        const savedBody = await getData("body");
        const savedDraft = await getData("draft");

        if (typeof savedBody === "string") {
          body = savedBody;
        }

        if (typeof savedDraft === "string") {
          draft.value = savedDraft;
        }

        if (navigator.storage?.persist) {
          try {
            await navigator.storage.persist();
          } catch {}
        }

        saveStatus.textContent = "保存機能 ON";
        update();
      } catch {
        saveStatus.textContent = "保存機能を開始できませんでした";
        update();
      }
    }

    start();
  </script>
</body>
</html>
