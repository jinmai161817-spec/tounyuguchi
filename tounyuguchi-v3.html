<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>投入口</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg: #f3f0ea;
  --card: #fff;
  --sub: #e7e2d9;
  --text: #222;
  --muted: #777;
  --blue: #2563eb;
  --blue2: #5d91e8;
  --red: #d94b50;
  --vvh: 100dvh;
  --vvtop: 0px;
}
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
body.editor-open { overflow: hidden; }
button, input, textarea, select { font: inherit; }
button { border: 0; cursor: pointer; }
.app {
  min-height: 100dvh;
  padding: max(16px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
}
.small { color: var(--muted); font-size: 12px; white-space:nowrap; }
.pill {
  background: #fff;
  color: #555;
  padding: 9px 12px;
  border-radius: 999px;
  font-weight: 700;
  box-shadow: 0 1px 5px rgba(0,0,0,.07);
}

/* ---------- 原稿庫 ---------- */
#libraryScreen { display: block; }
.top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px; }
h1 { margin:0; font-size:26px; }
.library-actions { display:flex; gap:8px; margin-bottom:12px; }
.library-actions button { flex:1; background:#fff; border-radius:14px; padding:12px 8px; font-weight:800; }
.breadcrumb { display:flex; align-items:center; gap:5px; overflow-x:auto; white-space:nowrap; padding:8px 2px 12px; font-size:13px; color:#666; }
.crumb { background:transparent; color:var(--blue); padding:3px; font-weight:700; }
.file-list { display:flex; flex-direction:column; gap:8px; }
.item { display:flex; align-items:center; gap:10px; background:#fff; border-radius:15px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
.item-main { min-width:0; flex:1; background:transparent; text-align:left; padding:0; }
.item-name { display:block; font-size:16px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-info { display:block; margin-top:3px; color:#999; font-size:11px; }
.item-menu { background:transparent; font-size:22px; color:#777; padding:7px; }
.empty { text-align:center; color:#999; padding:50px 10px; line-height:1.8; }

/* ---------- 投入口：画面そのものを固定 ---------- */
#editorScreen { display:none; }
#editorScreen.active {
  display:grid;
  position:fixed;
  z-index:10;
  left:0;
  right:0;
  top:0;
  height:var(--vvh);
  overflow:hidden;
  background:var(--bg);
  padding:max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
  grid-template-rows:auto minmax(105px, 1fr) auto;
  gap:12px;
}
.editor-head { display:flex; flex-wrap:wrap;align-items:flex-start; justify-content:space-between; gap:8px; min-height:0; }
.back { background:#fff; border-radius:999px; padding:9px 12px; font-weight:800; white-space:nowrap; }
.file-title { flex:1; min-width:0; }
.file-title strong { display:block; font-size:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#backup { white-space:nowrap; }

.storage {
  min-height:0;
  overflow:hidden;
  background:var(--sub);
  border-radius:18px;
  padding:10px 12px 8px;
  display:flex;
  flex-direction:column;
}
.storage-label { flex:0 0 auto; font-size:12px; font-weight:800; color:#777; margin-bottom:6px; }
#preview {
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background:rgba(255,255,255,.5);
  border-radius:10px;
  padding:8px 10px;
  font-size:14px;
  line-height:1.55;
  color:#555;
  scrollbar-width:none;
}
#preview::-webkit-scrollbar { display:none; }
#previewText { white-space:pre-wrap; min-height:100%; overflow-wrap:anywhere; }
.insert-marker {
  display:inline-block;
  margin:0 3px;
  padding:1px 6px;
  border-radius:999px;
  background:#e7efff;
  color:#2563eb;
  font-size:11px;
  line-height:1.55;
  font-weight:800;
  white-space:nowrap;
  vertical-align:baseline;
}
#fullButton { flex:0 0 auto; display:block; margin:5px 0 0 auto; background:transparent; color:#666; font-size:12px; padding:3px; }

.bubble {
  position:relative;
  min-height:0;
  background:#fff;
  border:2px solid var(--blue2);
  border-radius:22px;
  padding:13px 14px 12px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}
.bubble::before {
  content:"";
  position:absolute;
  top:-11px;
  left:28px;
  width:18px;
  height:18px;
  background:#fff;
  border-left:2px solid var(--blue2);
  border-top:2px solid var(--blue2);
  transform:rotate(45deg);
}
.bubble-title { position:relative; z-index:1; font-size:14px; font-weight:800; color:#507fc9; margin-bottom:6px; }
#draft {
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  height:90px;
  resize:none;
  overflow-y:auto;
  border:0;
  outline:0;
  padding:0;
  background:transparent;
  color:#222;
  font:inherit;
  font-size:18px;
  line-height:1.5;
}
#draft::placeholder { color:#aaa; }
.send-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; }
.actions { display:flex; align-items:center; gap:8px; }
#undo { display:none; background:transparent; color:var(--red); padding:9px 5px; font-weight:700; }
#send { background:var(--blue); color:#fff; padding:12px 20px; border-radius:999px; font-size:16px; font-weight:800; }
#send:disabled { opacity:.3; }
/* キーボード表示中：上下の窓を一緒に縮める */
body.keyboard-open #editorScreen.active {
  grid-template-rows:
    auto
    minmax(82px, 1.5fr)
    minmax(120px, 1fr);
  gap: 8px;
}

body.keyboard-open .storage {
  padding: 7px 10px 6px;
}

body.keyboard-open .storage-label {
  margin-bottom: 3px;
}

body.keyboard-open #fullButton {
  margin-top: 2px;
}

body.keyboard-open .bubble {
  padding: 10px 12px 8px;
}

body.keyboard-open .bubble-title {
  margin-bottom: 3px;
}

body.keyboard-open #draft {
  height: 52px;
}

body.keyboard-open .send-row {
  margin-top: 3px;
}

body.keyboard-open #undo {
  padding: 5px 4px;
}

body.keyboard-open #send {
  padding: 9px 16px;
}
/* ---------- 本文編集 ---------- */
#fullModal {
  position:fixed;
  z-index:30;
  display:none;
  left:0;
  right:0;
  top:var(--vvtop);
  height:var(--vvh);
  overflow:hidden;
  background:var(--bg);
  padding:max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
}
#fullModal.active { display:block; }
.full-inner { height:100%; min-height:0; display:flex; flex-direction:column; }
.full-head { flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; gap:7px; margin-bottom:8px; }
.full-title { font-size:20px; font-weight:800; }
.switcher { display:flex; background:#ddd8cf; border-radius:999px; padding:3px; }
.switcher button { background:transparent; color:#666; border-radius:999px; padding:7px 10px; font-size:12px; font-weight:700; }
.switcher button.active { background:#fff; color:var(--blue); box-shadow:0 1px 4px rgba(0,0,0,.08); }
.font-row { flex:0 0 auto; display:flex; justify-content:flex-end; align-items:center; gap:7px; margin-bottom:7px; }
#fullSaveStatus { flex:0 0 auto; margin-bottom:7px; }
.editor-wrap { position:relative; flex:1 1 auto; min-height:0; background:#fff; border-radius:16px; overflow:hidden; }
#fullText, #verticalView {
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:#fff;
  color:#222;
  font-size:14px;
  line-height:1.55;
}
#fullText { display:none; resize:none; padding:14px; overflow:auto; -webkit-overflow-scrolling:touch; caret-color:var(--blue);}
#fullText.active { display:block; }
#verticalView {
  display:none;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  white-space:pre-wrap;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:18px 20px;
  user-select:none;
  -webkit-user-select:none;
  cursor:text;
}
#verticalView.active { display:block; }
.round-font { font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
.literary-font { font-family:"Hiragino Mincho ProN", "YuMincho", "Yu Mincho", serif; }
.vertical-caret {
  display:inline-block;
  width:1.15em;
  height:3px;
  margin:2px 0;
  border-radius:3px;
  background:var(--blue);
  vertical-align:middle;
  box-shadow:0 0 0 1px rgba(37,99,235,.08);
}
#verticalInput {
  position:fixed;
  width:2px;
  height:2px;
  left:50%;
  top:calc(var(--vvtop) + 54px);
  opacity:.01;
  padding:0;
  border:0;
  outline:0;
  resize:none;
  font-size:16px;
  background:transparent;
  color:transparent;
  caret-color:transparent;
  pointer-events:none;
}
body.keyboard-open #fullModal .font-row,
body.keyboard-open #fullSaveStatus { display:none; }
body.keyboard-open .full-head { margin-bottom:5px; }

/* ---------- ダイアログ ---------- */
.overlay { position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; background:rgba(0,0,0,.25); }
.sheet { width:100%; background:var(--bg); border-radius:22px 22px 0 0; padding:18px 14px max(18px, env(safe-area-inset-bottom)); max-height:78dvh; overflow-y:auto; }
.sheet h2 { margin:0 0 13px; font-size:20px; }
.sheet input, .sheet select { width:100%; border:1px solid #d5d0c8; border-radius:12px; background:#fff; padding:13px; outline:0; font-size:16px; }
.sheet-buttons { display:flex; gap:8px; margin-top:12px; }
.sheet-buttons button { flex:1; padding:13px; border-radius:13px; font-weight:800; }
.primary { background:var(--blue); color:#fff; }
.cancel { background:#fff; color:#555; }
.danger { background:#ffe8e8; color:#b72d32; }
.menu-list { display:flex; flex-direction:column; gap:8px; }
.menu-list button { width:100%; text-align:left; background:#fff; border-radius:13px; padding:14px; font-weight:750; }
.menu-list .danger { background:#ffe8e8; }
#toast { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); background:rgba(0,0,0,.82); color:#fff; padding:12px 20px; border-radius:999px; font-weight:800; display:none; z-index:100; white-space:nowrap; }
</style>
</head>
<body>
<main class="app">
  <section id="libraryScreen">
    <div class="top">
      <div>
        <h1>投入口</h1>
        <div class="small">📁 原稿庫</div>
      </div>
      <button id="trashButton" class="pill">🗑 ゴミ箱</button>
    </div>
    <div class="library-actions">
      <button id="newFolder">📁＋ フォルダ</button>
      <button id="newFile">📄＋ ファイル</button>
    </div>
    <div id="breadcrumb" class="breadcrumb"></div>
    <div id="fileList" class="file-list"></div>
  </section>

  <section id="editorScreen">
    <div class="editor-head">
      <button id="backButton" class="back">‹ 原稿庫</button>
      <div class="file-title">
        <strong id="currentFileName"></strong>
        <div class="small">📄 <span id="totalCount">0</span>字 ・ 今回 +<span id="sessionCount">0</span>字</div>
        <div id="saveStatus" class="small">保存準備中…</div>
      </div>
      <button id="backup" class="pill">TXT</button>
      <button id="exportAll" class="pill">全データ</button>
      <button id="importAll" class="pill">読込</button>
      <input id="importAllFile" type="file" accept="application/json,.json" hidden>
    </div>

    <section class="storage">
      <div class="storage-label">📖 執筆位置　☝️スクロールできます</div>
      <div id="preview"><div id="previewText"></div></div>
      <button id="fullButton">本文を編集 ›</button>
    </section>

    <section class="bubble">
      <div class="bubble-title">💬 次を書く。</div>
      <textarea id="draft" placeholder="ここに続きを投げ込む。"></textarea>
      <div class="send-row">
        <span class="small"><span id="draftCount">0</span>字</span>
        <div class="actions">
          <button id="undo">↩︎ Undo</button>
          <button id="send" disabled>送信 ➤</button>
        </div>
      </div>
    </section>
  </section>
</main>

<div id="toast"></div>

<section id="fullModal">
  <div class="full-inner">
    <div class="full-head">
      <div class="full-title">📄 本文 <span id="fullCount" class="small">0字</span></div>
      <div style="display:flex; gap:6px;">
        <div class="switcher">
          <button id="horizontalButton">横</button>
          <button id="verticalButton">縦</button>
        </div>
        <button id="closeFull" class="pill">閉じる</button>
      </div>
    </div>
    <div class="font-row">
      <span class="small">文字</span>
      <div class="switcher">
        <button id="roundButton">丸文字</button>
        <button id="literaryButton">文芸</button>
      </div>
    </div>
    <div id="fullSaveStatus" class="small">編集すると自動保存されます</div>
    <div class="editor-wrap">
      <textarea id="fullText"></textarea>
      <div id="verticalView" aria-label="縦書き本文"></div>
      <textarea id="verticalInput" aria-label="縦書き入力"></textarea>
    </div>
  </div>
</section>

<div id="nameOverlay" class="overlay">
  <div class="sheet">
    <h2 id="nameTitle">名前</h2>
    <input id="nameInput" type="text" autocomplete="off" placeholder="名前">
    <div class="sheet-buttons">
      <button id="nameCancel" class="cancel">キャンセル</button>
      <button id="nameOK" class="primary">決定</button>
    </div>
  </div>
</div>

<div id="menuOverlay" class="overlay">
  <div class="sheet">
    <h2 id="menuTitle">操作</h2>
    <div class="menu-list">
      <button id="renameItem">✏️ 名前を変更</button>
      <button id="moveItem">📦 移動</button>
      <button id="trashItem" class="danger">🗑 ゴミ箱へ</button>
      <button id="menuCancel">キャンセル</button>
    </div>
  </div>
</div>

<div id="moveOverlay" class="overlay">
  <div class="sheet">
    <h2>移動先</h2>
    <select id="moveSelect"></select>
    <div class="sheet-buttons">
      <button id="moveCancel" class="cancel">キャンセル</button>
      <button id="moveOK" class="primary">ここへ移動</button>
    </div>
  </div>
</div>

<div id="trashOverlay" class="overlay">
  <div class="sheet">
    <h2>🗑 ゴミ箱</h2>
    <div id="trashList" class="file-list"></div>
    <div class="sheet-buttons"><button id="trashClose" class="cancel">閉じる</button></div>
  </div>
</div>

<div id="trashMenuOverlay" class="overlay">
  <div class="sheet">
    <h2 id="trashMenuTitle">ゴミ箱</h2>
    <div class="menu-list">
      <button id="restoreItem">↩︎ 元に戻す</button>
      <button id="deleteForever" class="danger">⚠️ 完全に削除</button>
      <button id="trashMenuCancel">キャンセル</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const libraryScreen = $("libraryScreen");
const editorScreen = $("editorScreen");
const fileList = $("fileList");
const breadcrumb = $("breadcrumb");
const draft = $("draft");
const send = $("send");
const undo = $("undo");
const preview = $("preview");
const previewText = $("previewText");
const totalCount = $("totalCount");
const sessionCount = $("sessionCount");
const draftCount = $("draftCount");
const saveStatus = $("saveStatus");
const currentFileName = $("currentFileName");
const fullModal = $("fullModal");
const fullText = $("fullText");
const verticalView = $("verticalView");
const verticalInput = $("verticalInput");
const fullCount = $("fullCount");
const fullSaveStatus = $("fullSaveStatus");

let db = null;
let nodes = [];
let currentFolderId = "root";
let currentFileId = null;
let body = "";
let sessionAdded = 0;
let undoStack = [];
let draftSaveTimer = null;
let bodySaveTimer = null;
let positionSaveTimer = null;
let writingDirection = "horizontal";
let fontMode = "round";
let nameMode = null;
let selectedItemId = null;
let trashSelectedId = null;
let maxVisualHeight = window.visualViewport?.height || window.innerHeight;

/* ---------- 共通 ---------- */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function countChars(text) {
  return [...String(text).replace(/\r?\n/g, "")].length;
}
function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
function flash(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.style.display = "block";
  setTimeout(() => { toast.style.display = "none"; }, 1200);
}
function getNode(id) { return nodes.find(n => n.id === id); }
function childrenOf(parentId) { return nodes.filter(n => n.parentId === parentId && !n.trashed); }
function saveNodes() { return setData("nodes_v2", nodes); }
function currentFile() { return getNode(currentFileId); }
function currentInsertPosition() {
  const file = currentFile();
  return clamp(file?.insertPosition ?? body.length, 0, body.length);
}
function setFilePosition(position, save = true) {
  const file = currentFile();
  if (!file) return;
  const pos = clamp(position, 0, body.length);
  file.insertPosition = pos;
  file.cursorStart = pos;
  file.cursorEnd = pos;
  if (save) schedulePositionSave();
}
function schedulePositionSave() {
  clearTimeout(positionSaveTimer);
  positionSaveTimer = setTimeout(() => saveNodes().catch(() => {}), 220);
}

/* ---------- visualViewport：キーボードで画面を動かさず縮める ---------- */
function updateVisualViewport() {
  const vv = window.visualViewport;
  const height = vv?.height || window.innerHeight;
  const top = vv?.offsetTop || 0;
  if (height > maxVisualHeight - 20) maxVisualHeight = Math.max(maxVisualHeight, height);
  const keyboardOpen = maxVisualHeight - height > 120;
  document.documentElement.style.setProperty("--vvh", `${height}px`);
  document.documentElement.style.setProperty("--vvtop", `${top}px`);
  document.body.classList.toggle("keyboard-open", keyboardOpen);
}
updateVisualViewport();
window.addEventListener("resize", updateVisualViewport);
window.visualViewport?.addEventListener("resize", updateVisualViewport);
window.visualViewport?.addEventListener("scroll", updateVisualViewport);

/* ---------- IndexedDB ---------- */
function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("tounyuguchiDB", 1);
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains("data")) database.createObjectStore("data");
    };
    request.onsuccess = () => { db = request.result; resolve(); };
    request.onerror = () => reject(request.error);
  });
}
function getData(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("data", "readonly");
    const request = tx.objectStore("data").get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
function setData(key, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction("data", "readwrite");
    tx.objectStore("data").put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function loadOrCreateLibrary() {
  const savedNodes = await getData("nodes_v2");
  if (Array.isArray(savedNodes)) { nodes = savedNodes; return; }
  const oldBody = await getData("body");
  const oldDraft = await getData("draft");
  nodes = [{
    id: uid(), type:"file", name:"これまでの本文", parentId:"root", previousParentId:"root", trashed:false,
    body: typeof oldBody === "string" ? oldBody : "",
    draft: typeof oldDraft === "string" ? oldDraft : ""
  }];
  await saveNodes();
}

/* ---------- 原稿庫 ---------- */
function folderPath(folderId) {
  const result = [];
  let id = folderId;
  while (id && id !== "root") {
    const node = getNode(id);
    if (!node) break;
    result.unshift(node);
    id = node.parentId;
  }
  return result;
}
function renderBreadcrumb() {
  breadcrumb.innerHTML = "";
  const rootButton = document.createElement("button");
  rootButton.className = "crumb";
  rootButton.textContent = "原稿庫";
  rootButton.onclick = () => { currentFolderId = "root"; renderLibrary(); };
  breadcrumb.appendChild(rootButton);
  for (const folder of folderPath(currentFolderId)) {
    const arrow = document.createElement("span");
    arrow.textContent = "›";
    const button = document.createElement("button");
    button.className = "crumb";
    button.textContent = folder.name;
    button.onclick = () => { currentFolderId = folder.id; renderLibrary(); };
    breadcrumb.append(arrow, button);
  }
}
function renderLibrary() {
  renderBreadcrumb();
  fileList.innerHTML = "";
  const items = childrenOf(currentFolderId).sort((a,b) => {
    if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
    return a.name.localeCompare(b.name, "ja", { numeric:true });
  });
  if (!items.length) {
    fileList.innerHTML = `<div class="empty">ここは空っぽです。<br>📁か📄を作れます。</div>`;
    return;
  }
  for (const item of items) {
    const row = document.createElement("div");
    row.className = "item";
    const main = document.createElement("button");
    main.className = "item-main";
    const name = document.createElement("span");
    name.className = "item-name";
    name.textContent = (item.type === "folder" ? "📁 " : "📄 ") + item.name;
    const info = document.createElement("span");
    info.className = "item-info";

function renderSplitText(container, text, position, markerClass, markerText = "") {
  container.replaceChildren();
  const pos = clamp(position, 0, text.length);
  container.appendChild(document.createTextNode(text.slice(0, pos)));
  const marker = document.createElement("span");
  marker.className = markerClass;
  marker.textContent = markerText;
  marker.setAttribute("aria-hidden", "true");
  container.appendChild(marker);
  container.appendChild(document.createTextNode(text.slice(pos)));
  return marker;
}
function renderPreview(scrollToMarker = false) {
  const pos = currentInsertPosition();
  if (!body) {
    previewText.replaceChildren();
    const marker = document.createElement("span");
    marker.className = "insert-marker";
    marker.textContent = "▶ 今ここ";
    previewText.append(marker, document.createTextNode(" まだ本文はありません。"));
    if (scrollToMarker) requestAnimationFrame(() => { preview.scrollTop = 0; });
    return;
  }
  const marker = renderSplitText(previewText, body, pos, "insert-marker", "▶ 今ここ");
  if (scrollToMarker) {
    requestAnimationFrame(() => {
      const top = marker.offsetTop - preview.clientHeight / 2 + marker.offsetHeight / 2;
      preview.scrollTop = Math.max(0, top);
    });
  }
}
function updateEditorUI({ previewMarker = false } = {}) {

/* ---------- 本文編集：縦（表示と入力を分離） ---------- */
function textLengthIgnoringCaret(node) {
  if (node.nodeType === Node.TEXT_NODE) return node.data.length;
  if (node.nodeType === Node.ELEMENT_NODE && node.classList.contains("vertical-caret")) return 0;
  let total = 0;
  for (const child of node.childNodes) total += textLengthIgnoringCaret(child);
  return total;
}
function domPositionToTextOffset(root, container, offset) {
  let total = 0;
  let found = false;
  function walk(node) {
    if (found) return;
    if (node === container) {
      if (node.nodeType === Node.TEXT_NODE) total += clamp(offset, 0, node.data.length);
      else {
        const count = clamp(offset, 0, node.childNodes.length);
        for (let i = 0; i < count; i++) total += textLengthIgnoringCaret(node.childNodes[i]);
      }
      found = true;
      return;
    }
    if (node.nodeType === Node.TEXT_NODE) { total += node.data.length; return; }
    if (node.nodeType === Node.ELEMENT_NODE && node.classList.contains("vertical-caret")) return;
    for (const child of node.childNodes) walk(child);
  }
  walk(root);
  return found ? clamp(total, 0, body.length) : null;
}
function textOffsetFromPoint(x, y) {
  let container = null;
  let offset = 0;
  if (document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(x, y);
    if (pos) { container = pos.offsetNode; offset = pos.offset; }
  } else if (document.caretRangeFromPoint) {
    const range = document.caretRangeFromPoint(x, y);
    if (range) { container = range.startContainer; offset = range.startOffset; }
  }
  if (!container) return null;
  const element = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
  if (container !== verticalView && !verticalView.contains(element)) return null;
  return domPositionToTextOffset(verticalView, container, offset);
}
  function keepCaretVisible(force = false) {
  if (writingDirection !== "vertical" || !fullModal.classList.contains("active")) return;

  const caret = verticalView.querySelector(".vertical-caret");
  if (!caret) return;

  const v = verticalView.getBoundingClientRect();
  const c = caret.getBoundingClientRect();
  if (!v.width) return;

  const half = v.width / 2;
  const off = (c.left + c.width / 2) - (v.left + half);

  if (force || Math.abs(off) > half * 0.6) {
    caret.scrollIntoView({ block: "nearest", inline: "center" });
  }
}

new ResizeObserver(() => {
  if (document.activeElement === verticalInput) {
    keepCaretVisible(true);
  }
}).observe(verticalView);
  function renderVerticalView(scrollToCaret = false) {
  const pos = currentInsertPosition();
  let caret = verticalView.querySelector(".vertical-caret");

  if (!caret || verticalView.childNodes.length !== 3) {
    caret = renderSplitText(verticalView, body, pos, "vertical-caret", "");

    if (scrollToCaret) {
      requestAnimationFrame(() => keepCaretVisible(false));
    }
    return;
  }

  verticalView.childNodes[0].data = body.slice(0, pos);
  verticalView.childNodes[2].data = body.slice(pos);

  if (scrollToCaret) {
    requestAnimationFrame(() => keepCaretVisible(false));
  }
}
function focusVerticalInputAt(position) {
  const pos = clamp(position, 0, body.length);
  setFilePosition(pos, false);

  if (verticalInput.value !== body) verticalInput.value = body;

  try {
    verticalInput.focus({ preventScroll:true });

  }

}

    const savedFont = await getData("fontMode");
    if (savedDirection === "vertical" || savedDirection === "horizontal") writingDirection = savedDirection;
    if (savedFont === "round" || savedFont === "literary") fontMode = savedFont;
    if (navigator.storage?.persist) { try { await navigator.storage.persist(); } catch {} }
    applyFont();
    renderLibrary();
  } catch (error) {
    document.body.innerHTML = `<div style="padding:30px;font-family:sans-serif">保存機能を開始できませんでした。</div>`;
  }
}
start();
</script>
</body>
