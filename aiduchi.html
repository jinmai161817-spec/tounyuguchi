<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<title>相槌！</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
  background: #f5f5f5;
}

body {
  display: flex;
  flex-direction: column;
}

header {
  background: white;
  padding: 14px 18px 12px;
  border-bottom: 1px solid #ddd;
}

h1 {
  margin: 0;
  font-size: 20px;
}

header p {
  margin: 4px 0 0;
  font-size: 13px;
  color: #777;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  padding-bottom: 25px;
}

.row {
  display: flex;
  margin: 9px 0;
}

.me {
  justify-content: flex-end;
}

.wall {
  justify-content: flex-start;
}

.bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.me .bubble {
  background: #d9fdd3;
}

.wall .bubble {
  background: white;
}

#inputArea {
  display: flex;
  align-items: flex-end;
  gap: 8px;

  background: white;

  padding: 10px;
  padding-bottom:
    calc(10px + env(safe-area-inset-bottom));

  border-top: 1px solid #ddd;
}

textarea {
  flex: 1;

  resize: none;

  min-height: 44px;
  max-height: 130px;

  border: none;
  outline: none;

  border-radius: 22px;

  background: #f0f0f0;

  padding: 11px 14px;

  font: inherit;
  font-size: 16px;
}

button {
  border: none;

  border-radius: 22px;

  padding: 12px 16px;

  background: #222;
  color: white;

  font-weight: bold;
  font-size: 15px;
}

button:active {
  opacity: 0.6;
}
</style>
</head>

<body>

<header>
  <h1>相槌！</h1>
  <p>さあどうぞ、話せ！</p>
</header>

<div id="chat"></div>

<div id="inputArea">

  <textarea
    id="input"
    rows="1"
    placeholder="なんでも投げる"
  ></textarea>

  <button id="send">
    送信 ➤
  </button>

</div>

<script>

/* ========================================
   相槌 v1.1

   方針：
   ・内容は解析しない
   ・否定しない
   ・アイデアを追加しない
   ・楽しそうに聞く
   ・続きを促すときは基本的に受容を添える
======================================== */


/* --- 軽い食いつき --- */

const hooks = [
  "おっ",
  "ほうほう",
  "おお！",
  "おお？",
  "へえ！",
  "ふむふむ",
  "来た来た",
  "おっと？",
  "なるほどなるほど",
  "うんうん"
];


/* --- 肯定・興味 --- */

const positive = [
  "いいねぇ",
  "いいぞ",
  "それ気になる",
  "そこいい",
  "今のいい",
  "なんか出てきたな",
  "面白くなってきた",
  "これは楽しみ",
  "まだ化けそう",
  "いい感じ",
  "おもしろいおもしろい",
  "よしよし"
];


/* --- 続きを促す ---
   ※原則として単独では出さない
*/

const continuation = [
  "それから？",
  "続き聞かせて",
  "その先は？",
  "続けて続けて",
  "聞かせて",
  "もうちょい",
  "どうぞどうぞ",
  "そのままどうぞ",
  "まだ聞こう",
  "さてさて？"
];


/* --- 勢いづけ --- */

const push = [
  "そのまま行こう",
  "いいぞもっとやれ",
  "もう一段いこう",
  "アクセル踏んでいいぞ",
  "行ける行ける",
  "その調子",
  "好きに行こう",
  "どんどん行こう"
];


/* --- 単独で出しても冷たくない短文 --- */

const warmShort = [
  "うんうん",
  "ほうほう",
  "おっ",
  "おお！",
  "へえ！",
  "ふむふむ",
  "なるほどなるほど",
  "いいねぇ",
  "いいぞ",
  "来た来た",
  "それ気になる",
  "おもしろいおもしろい",
  "👀✨"
];


/* --- たまに出る大きめリアクション --- */

const big = [
  "おお、来た来た！ いいぞもっとやれ",
  "おっ、なんか出てきたな。続けて続けて",
  "ほうほう、面白くなってきた。その先は？",
  "うんうん、いいねぇ。もっと聞かせて",
  "おお？ それ気になる。どうぞどうぞ",
  "来た来た、これは楽しみ。続き聞かせて",
  "おっと？ いい感じだぞ。そのまま行こう",
  "おお、アクセル踏んできたな！ いいぞいいぞ",
  "はいはいはい、面白くなってきた。聞こう！",
  "うわ、なんか出てきたぞ。いいぞもっとやれ"
];


/* ========================================
   基本処理
======================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");


let recent = [];


/* 配列からランダム選択 */

function pick(array) {

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


/* ========================================
   相槌生成
======================================== */

function generateReaction() {

  let result = "";

  const roll = Math.random();


  /*
    35%
    短い温かいリアクション

    「で？」
    「はい、次」
    のような圧迫系は入れない
  */

  if (roll < 0.35) {

    result = pick(warmShort);

  }


  /*
    40%
    二連リアクション

    ここが主力
  */

  else if (roll < 0.75) {

    const type =
      Math.floor(Math.random() * 5);


    if (type === 0) {

      result =
        pick(hooks) +
        "、" +
        pick(continuation);

    }


    if (type === 1) {

      result =
        pick(positive) +
        "。 " +
        pick(continuation);

    }


    if (type === 2) {

      result =
        pick(hooks) +
        "、" +
        pick(positive);

    }


    if (type === 3) {

      result =
        pick(positive) +
        "。 " +
        pick(push);

    }


    if (type === 4) {

      result =
        pick(hooks) +
        "。 " +
        pick(push);

    }

  }


  /*
    20%
    三連リアクション

    少しテンション高め
  */

  else if (roll < 0.95) {

    const type =
      Math.floor(Math.random() * 3);


    if (type === 0) {

      result =
        pick(hooks) +
        "、" +
        pick(positive) +
        "。 " +
        pick(continuation);

    }


    if (type === 1) {

      result =
        pick(hooks) +
        "、" +
        pick(positive) +
        "。 " +
        pick(push);

    }


    if (type === 2) {

      result =
        pick(positive) +
        "。 " +
        pick(continuation) +
        " " +
        pick(push);

    }

  }


  /*
    5%
    大きく食いつく
  */

  else {

    result = pick(big);

  }


  /*
    直近6件と
    完全に同じ文章だったら再抽選
  */

  if (recent.includes(result)) {

    return generateReaction();

  }


  recent.push(result);


  if (recent.length > 6) {

    recent.shift();

  }


  return result;

}


/* ========================================
   メッセージ表示
======================================== */

function addMessage(text, type) {

  const row =
    document.createElement("div");

  row.className =
    "row " + type;


  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;


  row.appendChild(bubble);

  chat.appendChild(row);


  chat.scrollTop =
    chat.scrollHeight;

}


/* ========================================
   送信
======================================== */

function submit() {

  const text =
    input.value.trim();


  if (!text) return;


  addMessage(
    text,
    "me"
  );


  input.value = "";

  input.style.height =
    "44px";


  /*
    少しだけ間を置く

    毎回同じ時間だと機械感が出るので
    0.4〜1.2秒程度で揺らす
  */

  const delay =
    400 +
    Math.random() * 800;


  setTimeout(() => {

    addMessage(
      generateReaction(),
      "wall"
    );

  }, delay);

}


/* ========================================
   イベント
======================================== */

send.addEventListener(
  "click",
  submit
);


/*
  入力に合わせて
  テキスト欄を伸縮
*/

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "44px";

    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);


/* ========================================
   開幕
======================================== */

addMessage(
  "聞こう！",
  "wall"
);

</script>

</body>
</html>
