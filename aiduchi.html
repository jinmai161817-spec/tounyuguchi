<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
}

:root {

  --bg: #f5f5f5;

  --panel: #ffffff;

  --line: #dddddd;

  --text: #151515;

  --sub: #777777;

  --me: #d9fdd3;

  --soft: #f0f0f0;

  --danger: #c62828;

  /*
    iPhone Safari対策
  */

  --app-height: 100dvh;

  --app-top: 0px;
}


html,
body {

  margin: 0;

  width: 100%;

  height: 100%;

  background: var(--bg);

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

  overflow: hidden;

}


body {

  min-height: 100dvh;

}


button,
input,
textarea {

  font: inherit;

}


button {

  -webkit-tap-highlight-color: transparent;

}


.hidden {

  display: none !important;

}


/* =========================================================
   アプリ全体

   iPhone Safariでキーボードが出た時、
   visualViewportの位置と高さに追従する
========================================================= */

#app {

  position: fixed;

  left: 0;

  right: 0;

  top: var(--app-top);

  width: 100%;

  height: var(--app-height);

  display: flex;

  flex-direction: column;

  overflow: hidden;

}

========================================================= */

}


.topbarRow {

  align-items: center;

  gap: 10px;

.titleBlock {

}


h1 {

.iconButton {

  font-weight: 700;

}


.iconButton:active,
.primaryButton:active,
.actionButton:active,
.folderChoice:active,

/* =========================================================

========================================================= */

#toast {

    calc(

    );

  z-index: 200;

  font-size: 13px;

  opacity: 0;

  pointer-events: none;

  transition: opacity .2s;

}

  opacity: 1;

/* =========================================================
   データ
========================================================= */


function makeId(prefix) {

  return (

    prefix +

    "_" +

    Date.now()
      .toString(36) +

    "_" +

    Math.random()
      .toString(36)
      .slice(2, 8)

  );

}



function defaultData() {

  return {

    folders: [

      {

        id:
          UNCLASSIFIED_ID,

        name:
          "未分類",

        system:
          true

      }

    ],

    logs: []

  };

}



/*
  古いv2ログもそのまま使う
*/

function normalizeData(parsed) {


  if (

    !parsed ||

    !Array.isArray(
      parsed.folders
    )

    ||

    !Array.isArray(
      parsed.logs
    )

  ) {

    return defaultData();

  }


  if (

    !parsed.folders.some(

      folder =>
        folder.id ===
        UNCLASSIFIED_ID

    )

  ) {

    parsed.folders.unshift({

      id:
        UNCLASSIFIED_ID,

      name:
        "未分類",

      system:
        true

    });

  }


  parsed.logs.forEach(

    log => {


      if (

        !Array.isArray(
          log.messages
        )

      ) {

        log.messages =
          [];

      }


      log.messages.forEach(

        message => {


          if (
            !message.id
          ) {

            message.id =
              makeId(
                "msg"
              );

          }


          if (

            message.role ===
            "me"

            &&

            typeof message.excluded
              !==
              "boolean"

          ) {

            message.excluded =
              false;

          }

        }

      );

    }

  );


  return parsed;

}



function loadData() {

  try {


    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!raw) {

      return defaultData();

    }


    return normalizeData(

      JSON.parse(
        raw
      )

    );

  }


  catch (error) {

    return defaultData();

  }

}



function saveData() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

    return true;

  } catch (error) {

    console.error("保存に失敗しました", error);

    showToast(
      "保存できませんでした。JSONバックアップをおすすめします"
    );

    return false;
  }
}



function getLog(
  id = currentLogId
) {

  return data.logs.find(

    log =>
      log.id === id

  );

}



function getFolder(id) {

  return data.folders.find(

    folder =>
      folder.id === id

  );

}



function getMessage(
  messageId
) {

  const log =
    getLog();


  if (!log) {

    return null;

  }


  return log.messages.find(

    message =>
      message.id ===
      messageId

  );

}



/* =========================================================
   日時
========================================================= */


function formatDateTime(
  timestamp
) {

  return new Intl.DateTimeFormat(

    "ja-JP",

    {

      month:
        "numeric",

      day:
        "numeric",

      hour:
        "2-digit",

      minute:
        "2-digit"

    }

  ).format(

    new Date(
      timestamp
    )

  );

}



function defaultLogTitle() {

  const d =
    new Date();


  return (

    `${d.getMonth() + 1}` +

    "/" +

    `${d.getDate()}` +

    " " +

    String(
      d.getHours()
    ).padStart(
      2,
      "0"
    )

    +

    ":"

    +

    String(
      d.getMinutes()
    ).padStart(
      2,
      "0"
    )

  );

}



/* =========================================================
   安全処理
========================================================= */


function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



function escapeAttr(text) {

  return escapeHtml(
    text
  );

}



function sanitizeFileName(name) {

  return (

    name

      .replace(
        /[\\/:*?"<>|]/g,
        "_"
      )

      .replace(
        /\s+/g,
        " "
      )

      .trim()

      .slice(
        0,
        80
      )

    ||

    "相槌ログ"

  );

}



/* =========================================================
   トースト
========================================================= */


function showToast(text) {

  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(

      () => {

        toast.classList.remove(
          "show"
        );

      },

      1800

    );

}

/* =========================================================
   iPhone Safari
   キーボード・画面位置対策
========================================================= */


function syncViewport() {


  const viewport =
    window.visualViewport;


  const height =

    viewport

      ? viewport.height

      : window.innerHeight;


  const top =

    viewport

      ? viewport.offsetTop

      : 0;


  document.documentElement
    .style
    .setProperty(

      "--app-height",

      `${Math.round(height)}px`

    );


  document.documentElement
    .style
    .setProperty(

      "--app-top",

      `${Math.round(top)}px`

    );


  if (

    document.activeElement ===
    input

  ) {

    keepLatestVisible();

  }

}

*/

function keepLatestVisible() {


  requestAnimationFrame(

    () => {

      chat.scrollTop =
        chat.scrollHeight;

    }

  );


  setTimeout(

    () => {

      chat.scrollTop =
        chat.scrollHeight;

      chat.scrollTop =
        chat.scrollHeight;

    },

    160

  );


  setTimeout(

    () => {

      chat.scrollTop =
        chat.scrollHeight;

    },

    320

  );

}



if (

) {

}

/* =========================================================
   相槌生成
========================================================= */


function pick(array) {

  return array[

    Math.floor(

      Math.random() *

      array.length

    )

  ];

}



function generateReaction() {


  let result =
    "";


  const roll =
    Math.random();


  /*
    35%
    短い
  */

  if (
    roll < .35
  ) {


    result =
      pick(
        warmShort
      );

  }


  /*
    40%
    二連
  */

  else if (
    roll < .75
  ) {


    const type =
      Math.floor(

        Math.random() *

        5

      );


    if (
      type === 0
    ) {


      result =

        pick(hooks)

        +

        "、"

        +

        pick(continuation);

    }


    if (
      type === 1
    ) {


      result =

        pick(positive)

        +

        "。 "

        +

        pick(continuation);

    }


    if (
      type === 2
    ) {


      result =

        pick(hooks)

        +

        "、"

        +

        pick(positive);

    }


    if (
      type === 3
    ) {


      result =

        pick(positive)

        +

        "。 "

        +

        pick(push);

    }


    if (
      type === 4
    ) {


      result =

        pick(hooks)

        +

        "。 "

        +

        pick(push);

    }

  }


  /*
    20%
    三連
  */

  else if (
    roll < .95
  ) {


    const type =
      Math.floor(

        Math.random() *

        3

      );


    if (
      type === 0
    ) {


      result =

        pick(hooks)

        +

        "、"

        +

        pick(positive)

        +

        "。 "

        +

        pick(continuation);

    }


    if (
      type === 1
    ) {


      result =

        pick(hooks)

        +

        "、"

        +

        pick(positive)

        +

        "。 "

        +

        pick(push);

    }


    if (
      type === 2
    ) {


      result =

        pick(positive)

        +

        "。 "

        +

        pick(continuation)

        +

        " "

        +

        pick(push);

    }

  }


  /*
    5%
    大きい反応
  */

  else {


    result =
      pick(
        big
      );

  }


  /*
    完全同一の連発防止
  */

  if (

    recentReactions.includes(
      result
    )

  ) {


    return generateReaction();

  }


  recentReactions.push(
    result
  );


  if (

    recentReactions.length >
    6

  ) {


    recentReactions.shift();

  }


  return result;

}



/* =========================================================
   送信
========================================================= */


function submitMessage() {


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  const log =
    getLog();


  if (!log) {

    return;

  }


  const now =
    Date.now();


  const message = {


    id:
      makeId(
        "msg"
      ),


    role:
      "me",


    text:
      text,


    at:
      now,


    excluded:
      false

  };


  log.messages.push(
    message
  );


  log.updatedAt =
    now;


  saveData();


  addMessageElement(
    message
  );


  input.value =
    "";


  input.style.height =
    "44px";


  keepLatestVisible();


  const targetLogId =
    log.id;


  /*
    最低4回は普通の相槌。
    以後25%で自然な質問・要求。
    見た目は通常相槌と同じ。
  */
  sincePrompt++;

  const isPrompt =
    sincePrompt >= 4
    &&
    Math.random() < .25;

  if (isPrompt) {
    sincePrompt = 0;
  }


  const delay =

    400

    +

    Math.random() *
    800;


  setTimeout(

    () => {


      const targetLog =
        getLog(
          targetLogId
        );


      if (!targetLog) {

        return;

      }


      const reaction = {


        id:
          makeId(
            "msg"
          ),


        role:
          "wall",


        text:
          isPrompt
            ? (
                Math.random() < .7
                  ? pick(questions)
                  : pick(nudges)
              )
            : generateReaction(),


        at:
          Date.now()

      };


      targetLog.messages.push(
        reaction
      );


      targetLog.updatedAt =
        Date.now();


      saveData();


      if (

        currentLogId ===
        targetLogId

        &&

        !chatView
          .classList
          .contains(
            "hidden"
          )

      ) {


        addMessageElement(
          reaction
        );


        keepLatestVisible();

      }

    },

    delay

  );

}

    prompt(

      "新しいログ名",

      log.title

    );


  if (

    title === null

    ||

    !title.trim()

  ) {

    return;

  }


  log.title =
    title.trim();


  log.updatedAt =
    Date.now();


  saveData();


  renderChat();

}



/* =========================================================
   ログ移動
========================================================= */


function openMoveMenu() {


  const log =
    getLog();


  if (!log) {

    return;

  }


  let html =

    '<div class="modalTitle">移動先を選ぶ</div>';


  data.folders.forEach(

    folder => {


      html += `

        <button

          class="folderChoice${
            folder.id ===
            log.folderId

              ? " active"

              : ""
          }"

          data-folder-id="${
            escapeAttr(
              folder.id
            )
          }"

        >

          📁 ${escapeHtml(folder.name)}

        </button>

      `;

    }

  );


  html += `

    <button
      class="actionButton cancel"
      id="cancelMove"
    >

      キャンセル

    </button>

  `;


  openModal(
    html
  );


  modalSheet
    .querySelectorAll(
      ".folderChoice"
    )
    .forEach(

      button => {


        button.onclick =
          () => {


            moveCurrentLog(
              button.dataset.folderId
            );


            closeModal();

          };

      }

    );


  document
    .getElementById(
      "cancelMove"
    )
    .onclick =
      closeModal;

}



function moveCurrentLog(
  folderId
) {


  const log =
    getLog();


  const folder =
    getFolder(
      folderId
    );


  if (

    !log ||

    !folder

  ) {

    return;

  }


  log.folderId =
    folderId;


  log.updatedAt =
    Date.now();


  saveData();


  renderChat();


  showToast(

    `「${folder.name}」へ移動しました`

  );

}



/* =========================================================
   ログ削除
========================================================= */


function deleteCurrentLog() {


  const log =
    getLog();


  if (!log) {

    return;

  }


  const ok =
    confirm(

      `「${log.title}」を削除します。\nこの操作は元に戻せません。`

    );


  if (!ok) {

    return;

  }


  data.logs =

    data.logs.filter(

      item =>
        item.id !==
        log.id

    );


  saveData();


  closeLog();

}



/* =========================================================
   TXT書き出し
========================================================= */


async function exportCurrentLogTxt() {


  const log =
    getLog();


  if (!log) {

    return;

  }


  /*
    自分の発言だけ

    かつ

    TXT除外していないもの
  */

  const myMessages =

    log.messages

      .filter(

        message =>

          message.role ===
          "me"

          &&

          !message.excluded

      )

      .map(

        message =>
          message.text

      );


  if (
    !myMessages.length
  ) {


    showToast(
      "TXTに出す発言がありません"
    );


    return;

  }


  const plainText =
    myMessages.join(
      "\n\n"
    );


  const fileName =

    sanitizeFileName(

      log.title

      ||

      "相槌ログ"

    )

    +

    ".txt";


  /*
    iPhoneでは共有シート優先
  */

  try {


    const file =
      new File(

        [
          plainText
        ],

        fileName,

        {

          type:
            "text/plain;charset=utf-8"

        }

      );


    if (

      navigator.share

      &&

      navigator.canShare

      &&

      navigator.canShare({

        files:
          [file]

      })

    ) {


      await navigator.share({

        files:
          [file],

        title:
          log.title

      });


      return;

    }

  }


  catch (error) {


    if (

      error

      &&

      error.name ===
      "AbortError"

    ) {


      return;

    }

  }


  /*
    共有できない環境は
    ダウンロード
  */


  const blob =
    new Blob(

      [
        plainText
      ],

      {

        type:
          "text/plain;charset=utf-8"

      }

    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    fileName;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(

    () => {

      URL.revokeObjectURL(
        url
      );

    },

    1000

  );


  showToast(
    "TXTを書き出しました"
  );

}



/* =========================================================
   全データJSONバックアップ／復元
========================================================= */

function makeBackupFileName() {
  const d = new Date();

  const stamp =
    d.getFullYear() + "-"
    + String(d.getMonth() + 1).padStart(2, "0") + "-"
    + String(d.getDate()).padStart(2, "0") + "_"
    + String(d.getHours()).padStart(2, "0") + "-"
    + String(d.getMinutes()).padStart(2, "0");

  return `aiduchi-backup_${stamp}.json`;
}


async function exportAllDataJson() {

  const backup = {
    app: "相槌！",
    version: "2.3",
    exportedAt: new Date().toISOString(),
    data: data
  };

  const jsonText =
    JSON.stringify(backup, null, 2);

  const fileName =
    makeBackupFileName();

  try {

    const file =
      new File(
        [jsonText],
        fileName,
        { type: "application/json" }
      );

    if (
      navigator.share
      &&
      navigator.canShare
      &&
      navigator.canShare({ files: [file] })
    ) {

      await navigator.share({
        files: [file],
        title: "相槌！バックアップ"
      });

      return;
    }

  } catch (error) {

    if (
      error
      &&
      error.name === "AbortError"
    ) {
      return;
    }
  }

  const blob =
    new Blob(
      [jsonText],
      { type: "application/json" }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = fileName;

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );

  showToast(
    "JSONバックアップを書き出しました"
  );
}


function openRestorePicker() {
  restoreFileInput.value = "";
  restoreFileInput.click();
}


async function restoreAllDataJson(file) {

  if (!file) {
    return;
  }

  let parsed;

  try {

    const fileText =
      await file.text();

    parsed =
      JSON.parse(fileText);

  } catch (error) {

    showToast(
      "JSONを読み込めませんでした"
    );

    return;
  }

  const candidate =
    parsed && parsed.data
      ? parsed.data
      : parsed;

  if (
    !candidate
    ||
    !Array.isArray(candidate.folders)
    ||
    !Array.isArray(candidate.logs)
  ) {

    showToast(
      "相槌！のバックアップではなさそうです"
    );

    return;
  }

  const ok =
    confirm(
      "現在のログ・フォルダを、このJSONの内容で置き換えます。\n先に現在データをJSONバックアップしておくと安全です。"
    );

  if (!ok) {
    return;
  }

  const restored =
    normalizeData(candidate);

  const oldData =
    data;

  data =
    restored;

  if (!saveData()) {
    data = oldData;
    return;
  }

  currentLogId = null;
  sincePrompt = 0;

  chatView.classList.add("hidden");
  homeView.classList.remove("hidden");

  renderHome();

  showToast(
    "JSONから復元しました"
  );
}

/*
  入力欄をタップしたら

  ・viewportを再取得
  ・最新発言を見える位置へ
*/

input.addEventListener(

  "focus",

  () => {


    syncViewport();


    keepLatestVisible();

  }

);



/*
  入力欄の高さ変更
*/

input.addEventListener(

  "input",

  () => {


    input.style.height =
      "44px";


    input.style.height =

      Math.min(

        input.scrollHeight,

        140

      )

      +

      "px";


    keepLatestVisible();

  }

);



/*
  キーボード閉じた時も
  viewportを元へ戻す
*/

input.addEventListener(

  "blur",

  () => {


    setTimeout(

      () => {

        syncViewport();

      },

      120

    );

  }

);



/*
  外付けキーボード

  Cmd / Ctrl + Enter
*/

input.addEventListener(

  "keydown",

  event => {


    if (

      (
        event.metaKey
        ||
        event.ctrlKey
      )

      &&

      event.key ===
      "Enter"

    ) {


      event.preventDefault();


      submitMessage();

    }

  }

);



/* =========================================================
   起動
========================================================= */


renderHome();


syncViewport();


</script>
