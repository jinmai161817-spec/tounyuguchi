<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>相槌</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f5f5;
}

body {
  display: flex;
  flex-direction: column;
}

header {
  background: white;
  padding: 14px 18px 12px;
  border-bottom: 1px solid #ddd;
}

h1 {
  margin: 0;
  font-size: 20px;
}

header p {
  margin: 4px 0 0;
  font-size: 12px;
  color: #777;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  padding-bottom: 25px;
}

.row {
  display: flex;
  margin: 9px 0;
}

.me {
  justify-content: flex-end;
}

.wall {
  justify-content: flex-start;
}

.bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.me .bubble {
  background: #d9fdd3;
}

.wall .bubble {
  background: white;
}

#inputArea {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: white;
  padding: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid #ddd;
}

textarea {
  flex: 1;
  resize: none;
  min-height: 44px;
  max-height: 130px;
  border: none;
  outline: none;
  border-radius: 22px;
  background: #f0f0f0;
  padding: 11px 14px;
  font: inherit;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 22px;
  padding: 12px 16px;
  background: #222;
  color: white;
  font-weight: bold;
  font-size: 15px;
}

button:active {
  opacity: .6;
}
</style>
</head>

<body>

<header>
  <h1>相槌</h1>
  <p>内容は理解していません。聞いてはいます。</p>
</header>

<div id="chat"></div>

<div id="inputArea">
  <textarea
    id="input"
    rows="1"
    placeholder="なんでも投げる"
  ></textarea>
  <button id="send">送信 ➤</button>
</div>

<script>

const hooks = [
  "おっ",
  "ほう",
  "おお？",
  "おや？",
  "へえ",
  "ふむふむ",
  "来た",
  "おっと",
  "なるほど",
  "うわ"
];

const positive = [
  "いいね",
  "いいぞ",
  "それ気になる",
  "そこいい",
  "今のいい",
  "来た来た",
  "なんか出てきたな",
  "面白くなってきた",
  "これは楽しみ",
  "まだ化けそう"
];

const continuation = [
  "それから？",
  "続きは？",
  "その先は？",
  "続けて",
  "どうぞ",
  "もうちょい",
  "はい、次",
  "まだある？",
  "もう一個",
  "で？"
];

const push = [
  "もっとやれ",
  "そのまま行こう",
  "ここからだ",
  "もう一段いこう",
  "アクセル踏んでいいぞ",
  "止まるな止まるな",
  "行ける行ける"
];

const big = [
  "待って待って、なんか出てきたぞ。いいぞもっとやれ",
  "おお、来た来た。面白くなってきた。その先は？",
  "急にアクセル踏んできたな！？ いいぞ、そのまま行こう",
  "おっと？ なんか始まったぞ。続けて",
  "うわ、そこ行く？ それ気になる。もうちょい",
  "はいはいはい、来たな。続きどうぞ"
];

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

let recent = [];

function pick(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function generateReaction() {

  let result = "";
  const roll = Math.random();

  // 40%：短い
  if (roll < .40) {

    const short = [
      ...hooks,
      ...continuation,
      "うん",
      "はい",
      "どうぞどうぞ",
      "👀"
    ];

    result = pick(short);

  // 35%：二連
  } else if (roll < .75) {

    const type = Math.floor(Math.random() * 4);

    if (type === 0)
      result = pick(hooks) + "。 " + pick(continuation);

    if (type === 1)
      result = pick(positive) + "。 " + pick(continuation);

    if (type === 2)
      result = pick(hooks) + "、" + pick(positive);

    if (type === 3)
      result = pick(positive) + "。 " + pick(push);

  // 20%：三連
  } else if (roll < .95) {

    const type = Math.floor(Math.random() * 3);

    if (type === 0)
      result =
        pick(hooks) + "。 " +
        pick(positive) + "。 " +
        pick(continuation);

    if (type === 1)
      result =
        pick(hooks) + "、" +
        pick(positive) + "。 " +
        pick(push);

    if (type === 2)
      result =
        pick(positive) + "。 " +
        pick(continuation) + " " +
        pick(push);

  // 5%：大きく反応
  } else {
    result = pick(big);
  }

  // 直近6個と同じなら再抽選
  if (recent.includes(result)) {
    return generateReaction();
  }

  recent.push(result);

  if (recent.length > 6) {
    recent.shift();
  }

  return result;
}

function addMessage(text, type) {

  const row = document.createElement("div");
  row.className = "row " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  chat.appendChild(row);

  chat.scrollTop = chat.scrollHeight;
}

function submit() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "me");

  input.value = "";
  input.style.height = "44px";

  // 0.35～1.15秒後に返事
  const delay = 350 + Math.random() * 800;

  setTimeout(() => {

    addMessage(
      generateReaction(),
      "wall"
    );

  }, delay);
}

send.addEventListener("click", submit);

// 入力欄を文章量に合わせて伸ばす
input.addEventListener("input", () => {

  input.style.height = "44px";

  input.style.height =
    Math.min(input.scrollHeight, 130) + "px";
});

// 最初の一言
addMessage("どうぞ", "wall");

</script>

</body>
</html>
